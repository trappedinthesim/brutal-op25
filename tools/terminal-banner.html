<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #banner { box-sizing: border-box; display: flex; align-items: center; width: 460px; height: 170px; font-family: Consolas, 'Cascadia Code', monospace; }
  img { display: block; width: 111px; height: 166px; object-fit: contain; }
  .copy { padding-left: 17px; }
  .brand { color: #4c90f0; font-size: 30px; font-weight: 700; letter-spacing: 3px; white-space: nowrap; }
  .brand span { color: #e4f2ff; }
  .rule { width: 292px; height: 2px; margin: 10px 0 9px; background: linear-gradient(90deg,#4c90f0,#365b83 80%,transparent); }
  .label { color: #a4caff; font-size: 17px; font-weight: 700; letter-spacing: 2px; }
  .origin { color: #9baebe; font-size: 13px; letter-spacing: 1px; margin-top: 9px; }
</style>
<div id="banner" role="img" aria-label="Brutal OP25 tactical radio terminal banner">
  <img src="../src/terminal-radio.png" alt="">
  <div class="copy">
    <div class="brand">BRUTAL <span>OP25</span></div>
    <div class="rule"></div>
    <div class="label">TERMINAL SETUP</div>
    <div class="origin">BUILT ON BOATBOD / OP25</div>
  </div>
</div>
</html>
